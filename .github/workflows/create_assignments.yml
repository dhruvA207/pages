name: Create assignments from frontmatter

on:
  push:
    branches:
      - main
      - master

jobs:
  create-assignments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests
      - name: Check secret availability
        id: check-secret
        env:
          PAGES_BOT_PASSWORD: ${{ secrets.PAGES_BOT_PASSWORD }}
        run: |
          if [ -n "$PAGES_BOT_PASSWORD" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "PAGES_BOT_PASSWORD secret is not set, skipping assignment creation."
          fi
      - name: Run create assignments script
        if: steps.check-secret.outputs.has_secret == 'true'
        env:
          BASE_URL: https://spring.opencodingsociety.com
          PAGES_BOT_UID: toby
          PAGES_BOT_PASSWORD: ${{ secrets.PAGES_BOT_PASSWORD }}
        run: |
          python3 scripts/create_assignments_from_frontmatter.py --root . --base-url "$BASE_URL" --uid "$PAGES_BOT_UID" --password "$PAGES_BOT_PASSWORD"
